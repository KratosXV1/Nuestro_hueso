<body class="Inicio">

            <a href="index.html" class="contenedor1">Nuestro Hueso</a>

    </nav>
    <main>
        <section class="contenedor-form">
            <h2>
                Iniciar sesion
            </h2>
            <form id="formLogin" novalidate>
                <label for="correo">Correo Electronico: </label>
                <input type="email" id="correo" name="correo" required maxlength="100">
                <span class="error" id="error"></span>

                <label for="password">Contraseña: </label>
                <input type="password" id="password" name="password" required minlength="4" maxlength="12">
                <span class="error" id="errorContraseña"></span>

                <button type="submit" class="comprarBoton">Ingresar</button>

            </form>
        </section>
    </main>
    <script src = "js/login.js"></script> 
</body>
</html>
