<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="inicio">
    <header>
    <h1 class="contenedor contenedor1">
        <a href="index.html" class="contenedor1">Nuestro Hueso</a> 
    </h1>
    </header>
    <nav class="links">
        <a href="index.html" class="card">Home</a>
        <a href="blogs.html" class="card">Blogs</a>
        <a href="Nosotros.html" class="card">Nosotros</a>
        <a href="productos.html" class="card">Productos</a>
        <a href="sesion.html" class="card">Iniciar sesión</a>
        <a href="registro.html" class="card">Registrar usuario</a>
    </nav>
    <main>
        <section>
            <h2>Registro de Usuario</h2>
            <form id="formRegistro" novalidate>
                <div>
                    <label for="run">Rut(sin puntos ni guión, 123456789)</label><br>
                    <input type="text" id="run" name="run" maxlength="9" placeholder="123456789" >
                    <span id="errorRun" class="mensaje-error" style="color: crimson; display: block;"></span>
                </div>

                <div>
                    <label for="nombre"> Nombre </label><br>
                    <input type="text" id="nombre" name="nombre" maxlength="50">
                    <span id="errorNombre" class="mensaje-error" style="color: red; display: block;"></span>
                </div>

                <div>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" name="apellidos" id="apellidos" maxlength="100">
                    <span id="errorApellidos" class="mensaje-error" style="color: red; display: block;"></span>
                </div>

                <div>
                    <label for="correo">Correo Electronico</label><br>
                    <input type="email" name="correo" id="correo" maxlength="100">
                    <span id="errorCorreo" class="mensaje-error" style="color: red; display: block;"></span>
                </div>

                <div>
                    <label for="password">Contraseña (Debe contener entre 4 y 10 caracteres)</label><br>
                    <input type="password" name="password" id="password" minlength="4" maxlength="10">
                    <span id="errorContraseña" class="mensaje-error" style="color: red;display: block;"></span>
                </div>

                <div>
                    <label for="direccion">Dirección:</label><br>
                    <input type="text" name="direccion" id="direccion" maxlength="100">
                    <span id="errorDireccion" class="mensaje-error" style="color: red;display: block;"></span>
                </div>
                
                <div>
                    <label for="region">Región:</label><br>
                    <select id="region" name="region">
                        <option value="">-- Seleccione una región --</option>
                    </select>
                    <span id="errorRegion" class="mensaje-error" style="color: red; display: block;"></span>
                </div>


                <div>
                    <label for="comuna">Comuna:</label><br>
                    <select id="comuna" name="comuna" disabled>
                        <option value="">-- Seleccione una comuna --</option>
                    </select>
                    <span id="errorComuna" class="mensaje-error" style="color: red; display: block;"></span>
                </div>

                <br>
                <button type="submit" id="btnRegistrar">Registrar</button>


            </form>
        </section>
    </main>
    <footer class="footerInicio">
        <p>Aprobado por naricitas húmedas y colitas felices 🐶🐱</p>
    </footer>
    <script src="js/registro.js"></script>
</body>
</html>
